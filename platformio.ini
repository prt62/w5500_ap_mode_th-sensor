[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino

; Serial monitor ki speed jo code me Serial.begin(115200) hai
monitor_speed = 115200

; Wi-Fi + Bluetooth ke liye extra flash memory allocate karne ke liye
board_build.partitions = huge_app.csv

; Required Libraries
lib_deps =
    adafruit/DHT sensor library @ ^1.4.6
    adafruit/Adafruit Unified Sensor @ ^1.1.14
    arduino-libraries/Ethernet @ ^2.0.2